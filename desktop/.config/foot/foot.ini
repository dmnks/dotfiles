[main]
font=JetBrains Mono Nerd Font:size=13, Noto Color Emoji:size=13
initial-window-size-chars=211x54
title=Terminal
pad=12x0 center
gamma-correct-blending=false
include=/usr/share/foot/themes/gruvbox
shell=systemd-run --quiet --scope --user tide

[colors]
# Darker foreground (fg2)
foreground=d5c4a1
background=1d2021

[colors2]
background=f2e5bc

[csd]
size=0
border-width=1
border-color=7c6f64

[key-bindings]
fullscreen=F11
show-urls-launch=Control+Shift+k

[mouse-bindings]
primary-paste=none
