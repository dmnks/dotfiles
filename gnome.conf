[GWeather4]
temperature-unit='centigrade'

[desktop/calendar]
show-weekdate=true
week-start-day='monday'

[desktop/datetime]
automatic-timezone=true

[desktop/input-sources]
sources=[('xkb', 'us'), ('xkb', 'cz+qwerty'), ('xkb', 'sk+qwerty')]
xkb-options=['caps:ctrl_modifier']

[desktop/interface]
clock-format='24h'
clock-show-weekday=true
cursor-blink=false
gtk-enable-primary-paste=false
monospace-font-name='Maple Mono NF 13'

[desktop/notifications]
show-in-lock-screen=false

[desktop/peripherals/keyboard]
delay=uint32 300

[desktop/wm/keybindings]
maximize-vertically=['<Shift><Super>Up']
move-to-center=['<Super>KP_0']
move-to-monitor-up=@as []

[desktop/wm/preferences]
resize-with-right-button=true

[settings-daemon/plugins/color]
night-light-enabled=true

[settings-daemon/plugins/power]
sleep-inactive-ac-type='nothing'

[shell/extensions/blur-my-shell]
pipelines={'pipeline_default': {'name': <'Default'>, 'effects': <[<{'type': <'native_static_gaussian_blur'>, 'id': <'effect_000000000000'>, 'params': <{'radius': <30>, 'brightness': <0.90000000000000002>, 'unscaled_radius': <100>}>}>]>}, 'pipeline_default_rounded': {'name': <'Default rounded'>, 'effects': <[<{'type': <'native_static_gaussian_blur'>, 'id': <'effect_000000000001'>, 'params': <{'radius': <30>, 'brightness': <0.90000000000000002>, 'unscaled_radius': <10>}>}>, <{'type': <'corner'>, 'id': <'effect_000000000002'>, 'params': <{'radius': <24>}>}>]>}}
rounded-blur-found=false
settings-version=2

[shell/extensions/blur-my-shell/dash-to-dock]
pipeline='pipeline_default_rounded'
static-blur=true

[shell/extensions/blur-my-shell/lockscreen]
blur=false
pipeline='pipeline_default'

[shell/extensions/blur-my-shell/panel]
pipeline='pipeline_default'

[shell/extensions/dash-to-dock]
always-center-icons=false
application-counter-overrides-notifications=true
apply-custom-theme=false
background-opacity=0.80000000000000004
click-action='minimize'
dash-max-icon-size=64
dock-position='BOTTOM'
extend-height=false
height-fraction=0.90000000000000002
preferred-monitor=-2
preview-size-scale=0.0
running-indicator-style='DEFAULT'
show-icons-notifications-counter=false
show-show-apps-button=false
show-trash=false

[shell/extensions/just-perfection]
accessibility-menu=true
alt-tab-icon-size=0
clock-menu-position=1
clock-menu-position-offset=8
dash=true
dash-icon-size=0
events-button=true
notification-banner-position=2
osd-position=0
panel=true
panel-button-padding-size=0
panel-icon-size=0
panel-in-overview=true
panel-size=0
power-icon=true
ripple-box=true
search=true
show-apps-button=true
startup-status=1
support-notifier-type=0
switcher-popup-delay=true
theme=false
window-demands-attention-focus=false
window-picker-icon=true
workspace=true
workspace-background-corner-size=0
workspace-switcher-size=0
workspaces-in-app-grid=true

[shell/extensions/lockkeys]
capslock-indicator='never'
capslock-notification='off'

[system/location]
enabled=true
