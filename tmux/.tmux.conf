###############################################################################
# Terminal stuff
###############################################################################

setw -g xterm-keys on
set -ga terminal-overrides ",*:Tc"

###############################################################################
# Key bindings
###############################################################################

set -g prefix C-a
unbind C-b
bind C-a send-prefix

setw -g mode-keys vi

bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R
bind -n M-m resize-pane -Z

bind -n M-q select-window -l
bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5
bind -n M-6 select-window -t :6

bind -n M-enter popup -E -yC
bind -n M-s popup -E -yC -w 140 -h 80% tide git
bind -n M-w popup -E -y0 -B tide palette

bind -n S-Left {
    swap-window -t -1
    select-window -t -1
}
bind -n S-Right {
    swap-window -t +1
    select-window -t +1
}

bind s choose-tree -sNZO name
bind -n M-o split-window -h
bind -n M-e split-window -v

bind R run-shell "tide refresh"
bind k confirm-before -p "Kill session #{session_name}? (y/n)" "kill-session"

# vim-like copy mode ('C-v' already does the same as 'v' so we're fine)
bind -T copy-mode-vi 'v' send -X begin-selection
bind -T copy-mode-vi 'y' send -X copy-selection-and-cancel

###############################################################################
# Quality of life
###############################################################################

# more friendly terminal titles
set -g set-titles on
set -g set-titles-string "#S — tmux"

# start with window 1 (instead of 0)
set -g base-index 1
# start with pane 1
set -g pane-base-index 1

# set scrollback history to 10k
set -g history-limit 10000

# needed for vim mode switching
set -sg escape-time 10

# attach to last session when current is killed
set -g detach-on-destroy off

set -g window-size smallest
set -g renumber-windows on
set -g focus-events on

###############################################################################
# Status
###############################################################################

setw -g automatic-rename off
setw -g allow-rename off

###############################################################################
# Colors
###############################################################################

if -F '#{==:#{THEME_VARIANT},light}' \
    'set -g @accent_fg "#{@accent_fg_l}"' \
    'set -g @accent_fg "#{@accent_fg_d}"'

set -g status on
set -g status-style fg=default,bg=default
set -g status-left  "#[fg=#{E:#{@accent_fg}},bg=default]  #{@repo} #[default] #(tide status left '#{session_path}')    "
set -g status-right "#{?window_zoomed_flag,,}   #{pane_current_command} "
set -g status-left-length 60
set -g status-right-length 60
set -g status-interval 60

set -g window-style                 bg="#{THEME_COLOR_BG}"
set -g window-status-format         "#[fg=default,bg=default]  #{window_name}  #[default]"
set -g window-status-current-format "#[fg=#{THEME_COLOR_ACTIVE_FG},bg=#{THEME_COLOR_ACTIVE_BG},nounderscore]  #{window_name}  #[default]"
set -g window-status-separator      ""

set -g pane-border-lines single
set -g pane-border-style fg="#{THEME_COLOR_DIM3}",bg="#{THEME_COLOR_BG}"
set -g pane-active-border-style fg="#{THEME_COLOR_DIM3}",bg="#{THEME_COLOR_BG}"

set -g popup-style bg="#{THEME_COLOR_BG}"
set -g popup-border-lines rounded
set -g popup-border-style fg="#{THEME_COLOR_DIM2}",bg="#{THEME_COLOR_BG}"

set -g mode-style fg="#{THEME_COLOR_ACTIVE_FG}",bg="#{THEME_COLOR_ACTIVE_BG}"
set -g message-format "#[#{E:message-style}] #{message}"
set -g message-style fg="#{E:#{@accent_fg}}",bg=default,fill=black
set -g monitor-bell off

set-hook -g client-dark-theme "run-shell 'tide update prefer-dark'"
set-hook -g client-light-theme "run-shell 'tide update default'"
